# Operational arm limits derived from the checked-in link masses, RobStride
# continuous torque ratings, and Isaac force-drive damping.  These are arm
# limits, not the motors' unloaded 100 rpm rated-load speed.  Because the
# limits already include the continuous-torque margin, a scaling factor of 1.0
# means "use the validated operational limit"; RViz can still scale it down.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

joint_limits:
  j1:
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 0.50
  j2:
    has_velocity_limits: true
    max_velocity: 0.20
    has_acceleration_limits: true
    max_acceleration: 0.35
  j3:
    has_velocity_limits: true
    max_velocity: 0.30
    has_acceleration_limits: true
    max_acceleration: 0.50
  j4:
    has_velocity_limits: true
    max_velocity: 0.30
    has_acceleration_limits: true
    max_acceleration: 0.75
  j5:
    has_velocity_limits: true
    max_velocity: 0.30
    has_acceleration_limits: true
    max_acceleration: 0.75
