controller_manager:
  ros__parameters:
    update_rate: 100
    pallet_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    pallet_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
pallet_arm_controller:
  ros__parameters:
    joints:
    - J1
    - J2
    - J3
    - J4
    - J5
    - J6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
pallet_gripper_controller:
  ros__parameters:
    joints:
    - g_r
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
