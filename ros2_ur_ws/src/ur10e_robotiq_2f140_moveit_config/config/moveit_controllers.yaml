# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Gripper contact confirmation can take several seconds when Isaac runs below
# real time.  Keep duration monitoring enabled, but leave enough margin for the
# action bridge's measured-position/stall confirmation (10 s maximum).
trajectory_execution:
  execution_duration_monitoring: true
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_simple_controller_manager:
  controller_names:
    - ur_manipulator_controller
    - gripper_controller

  ur_manipulator_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    allowed_execution_duration_scaling: 1.5
    allowed_goal_duration_margin: 12.0
    joints:
      - robotiq_finger_joint
