# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Gripper contact confirmation can legitimately take up to 2.5 s.  The MoveIt
# default canceled the GripperCommand action after about 1.28 s, even though the
# pads had already contacted the block.  Keep duration monitoring enabled, but
# leave enough margin for measured-position/stall confirmation.
trajectory_execution:
  execution_duration_monitoring: true
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_simple_controller_manager:
  controller_names:
    - ur_manipulator_controller
    - gripper_controller

  ur_manipulator_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    allowed_execution_duration_scaling: 1.5
    allowed_goal_duration_margin: 3.0
    joints:
      - robotiq_finger_joint
